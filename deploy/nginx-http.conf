# Initial HTTP virtual host, used before obtaining the HTTPS certificate.
log_format sorarng_safe '$time_iso8601 $request_method $uri $status';
server {
    listen 80;
    listen [::]:80;
    server_name sorarng.54-37-13-70.sslip.io;
    client_max_body_size 1m;
    access_log /var/log/nginx/sorarng.access.log sorarng_safe;
    location ^~ /api/auth/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sorarng-acme;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
