# Dedicated virtual host; keep the VPS's other sites intact.
log_format sorarng_safe '$time_iso8601 $request_method $uri $status';
server {
    listen 80;
    listen [::]:80;
    server_name sorarng.54-37-13-70.sslip.io;
    access_log /var/log/nginx/sorarng.access.log sorarng_safe;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sorarng-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sorarng.54-37-13-70.sslip.io;
    ssl_certificate /etc/letsencrypt/live/sorarng.54-37-13-70.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorarng.54-37-13-70.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/sorarng.access.log sorarng_safe;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security 'max-age=86400' always;
    location ^~ /api/local-card-assets { return 404; }
    location ^~ /api/auth/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
